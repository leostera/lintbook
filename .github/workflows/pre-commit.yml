name: Pre-commit Checks

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lintbook:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Build lintbook
      run: cargo build --bin lintbook
      
    - name: Run lintbook on codebase
      run: ./target/debug/lintbook check
