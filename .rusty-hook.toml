[hooks]
pre-commit = """
# Get list of staged files and run treelint on them, excluding test fixtures
STAGED_FILES=$(git diff --cached --name-only --diff-filter=ACM | grep -v "crates/treelint-tests/fixtures")
if [ -n "$STAGED_FILES" ]; then
    cargo run -p treelint-cli -- check $STAGED_FILES
fi
"""
