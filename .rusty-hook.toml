[hooks]
pre-commit = """
set -eu

STAGED_FILES=$(
  git diff --cached --name-only --diff-filter=ACM |
    grep -E '\\.(rs|py|pyi|ex|exs|sql)$' |
    grep -v '^crates/lintbook-tests/fixtures/' || true
)

if [ -n "$STAGED_FILES" ]; then
  cargo run -q -p lintbook-cli --bin lintbook -- check $STAGED_FILES
fi
"""
