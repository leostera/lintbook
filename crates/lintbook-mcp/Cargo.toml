[package]
name = "lintbook-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for lintbook - expose linting tools to LLM applications"


[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# Lintbook internal crates
lintbook-config = { path = "../lintbook-config" }
lintbook-rules = { path = "../lintbook-rules" }
lintbook-scanner = { path = "../lintbook-scanner" }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
