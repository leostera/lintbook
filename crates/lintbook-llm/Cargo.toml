[package]
name = "lintbook-llm"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
sha2 = { workspace = true }
hex = "0.4"
ignore = "0.4"
tree-sitter = { workspace = true }
async-trait = "0.1"
lintbook-config = { path = "../lintbook-config" }
lintbook-lang = { path = "../lintbook-lang" }

[dev-dependencies]
tempfile = "3.0"
