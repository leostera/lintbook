[package]
name = "lintbook-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lintbook"
path = "src/main.rs"

[dependencies]
structopt = "0.3"
lintbook-scanner = { path = "../lintbook-scanner" }
lintbook-config = { path = "../lintbook-config" }
lintbook-core = { path = "../lintbook-core" }
lintbook-lang = { path = "../lintbook-lang" }
lintbook-mcp = { path = "../lintbook-mcp" }
lintbook-rules = { path = "../lintbook-rules" }
anyhow = { workspace = true }
colored = "3.0"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3.8"
