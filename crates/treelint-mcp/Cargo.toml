[package]
name = "treelint-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for treelint - expose linting tools to LLM applications"


[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# Treelint internal crates
treelint-config = { path = "../treelint-config" }
treelint-scanner = { path = "../treelint-scanner" }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"